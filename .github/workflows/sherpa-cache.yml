name: Release Build Caches

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/release.yml
      - .github/workflows/sherpa-cache.yml
      - Voxt.xcodeproj/project.pbxproj
      - Voxt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - tools/build_sherpa_onnx_macos.sh
  schedule:
    - cron: "23 3 */5 * *"
  workflow_dispatch:

concurrency:
  group: release-build-caches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm-cache:
    name: Warm release build caches
    runs-on: macos-26
    env:
      SHERPA_ONNX_REF: 142807252687d81b40d6315f23470a1512a00de3
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Sherpa ONNX cache key
        id: sherpa_cache_key
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/-+$//')"
          SHERPA_SCRIPT_HASH="$(shasum -a 256 tools/build_sherpa_onnx_macos.sh | awk '{print $1}')"
          echo "xcode_version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "key=sherpa-onnx-${RUNNER_OS}-${RUNNER_ARCH}-${XCODE_VERSION}-${SHERPA_ONNX_REF}-${SHERPA_SCRIPT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Sherpa ONNX runtime cache
        id: sherpa_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ThirdParty/sherpa-onnx/install
            ThirdParty/sherpa-onnx/sherpa-onnx.xcframework
          key: ${{ steps.sherpa_cache_key.outputs.key }}

      - name: Build Sherpa ONNX runtime on cache miss
        if: steps.sherpa_cache.outputs.cache-hit != 'true'
        run: tools/build_sherpa_onnx_macos.sh

      - name: Validate Sherpa ONNX runtime
        run: |
          set -euo pipefail
          test -f ThirdParty/sherpa-onnx/install/include/sherpa-onnx/c-api/c-api.h
          test -f ThirdParty/sherpa-onnx/install/lib/libsherpa-onnx.a
          test -f ThirdParty/sherpa-onnx/install/lib/libonnxruntime.a
          test -f ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/Info.plist
          test -f ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/macos-arm64_x86_64/libsherpa-onnx.a
          lipo ThirdParty/sherpa-onnx/install/lib/libsherpa-onnx.a -verify_arch arm64 x86_64
          lipo ThirdParty/sherpa-onnx/install/lib/libonnxruntime.a -verify_arch arm64 x86_64
          lipo ThirdParty/sherpa-onnx/sherpa-onnx.xcframework/macos-arm64_x86_64/libsherpa-onnx.a -verify_arch arm64 x86_64

      - name: Save Sherpa ONNX runtime cache
        if: steps.sherpa_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ThirdParty/sherpa-onnx/install
            ThirdParty/sherpa-onnx/sherpa-onnx.xcframework
          key: ${{ steps.sherpa_cache_key.outputs.key }}

      - name: Resolve Xcode compilation cache key
        id: compilation_cache_key
        run: |
          set -euo pipefail
          PACKAGE_RESOLVED="Voxt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          PACKAGE_HASH="$(shasum -a 256 "$PACKAGE_RESOLVED" | awk '{print $1}')"
          CACHE_PREFIX="xcode-compilation-${RUNNER_OS}-${RUNNER_ARCH}-${{ steps.sherpa_cache_key.outputs.xcode_version }}-release-universal-v1"
          echo "key=${CACHE_PREFIX}-${PACKAGE_HASH}" >> "$GITHUB_OUTPUT"
          echo "restore_prefix=${CACHE_PREFIX}-" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode compilation cache
        id: compilation_cache
        uses: actions/cache/restore@v5
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.compilation_cache_key.outputs.key }}
          restore-keys: |
            ${{ steps.compilation_cache_key.outputs.restore_prefix }}

      - name: Build Universal Release cache on miss
        if: steps.compilation_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cp Config/SherpaOnnx.local.xcconfig.example Config/SherpaOnnx.local.xcconfig
          xcodebuild \
            -project Voxt.xcodeproj \
            -scheme Voxt \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            -showBuildTimingSummary \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            build \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_EXECUTABLE="build/DerivedData/Build/Products/Release/Voxt.app/Contents/MacOS/Voxt"
          test -f "$APP_EXECUTABLE"
          lipo "$APP_EXECUTABLE" -verify_arch arm64 x86_64

      - name: Validate Xcode compilation cache
        run: |
          set -euo pipefail
          test -f build/DerivedData/CompilationCache.noindex/builtin/v1.validation
          du -sh build/DerivedData/CompilationCache.noindex

      - name: Save Xcode compilation cache
        if: steps.compilation_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: ${{ steps.compilation_cache_key.outputs.key }}
